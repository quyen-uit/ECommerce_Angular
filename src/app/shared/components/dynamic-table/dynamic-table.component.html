<mat-card class="dynamic-table-card">
    <mat-card-header>
        <mat-card-title class="card-title">{{ title }}</mat-card-title>
        <div class="table-actions">
            <button mat-raised-button color="primary" (click)="onAdd()">
                {{ "ADD" }}
            </button>
            <button mat-raised-button color="primary">{{ "DELETE" }}</button>

            <button color="primary" mat-icon-button aria-label="Toggle columns" [matMenuTriggerFor]="columnMenu">
                <mat-icon>view_column</mat-icon>
            </button>
            <mat-menu #columnMenu="matMenu">
                <button mat-menu-item *ngFor="let col of columns">
                    <mat-checkbox [checked]="col.visible" (change)="toggleColumnVisibility(col.key)">
                        {{ col.label }}
                    </mat-checkbox>
                </button>
            </mat-menu>
        </div>
    </mat-card-header>
    <mat-card-content>
        <div class="table-container">
            <form [formGroup]="filterForm" (keydown.enter)="applyFiltersFromForm()">
                <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 dynamic-table">
                    <!-- None Column Header-->
                    <ng-container matColumnDef="none">
                        <th mat-header-cell *matHeaderCellDef></th>
                    </ng-container>

                    <!-- Selection Column -->
                    <ng-container matColumnDef="select">
                        <th mat-header-cell *matHeaderCellDef class="table-header">
                            <mat-checkbox (change)="toggleAllRows($event)" [checked]="isAllSelected()"
                                [indeterminate]="selection.hasValue() && !isAllSelected()"></mat-checkbox>
                        </th>
                        <td mat-cell *matCellDef="let row">
                            <mat-checkbox (click)="$event.stopPropagation()" (change)="toggleRow(row)"
                                [checked]="selection.isSelected(row)"></mat-checkbox>
                        </td>
                    </ng-container>

                    <!-- Data Columns -->
                    <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
                        <ng-container *ngIf="column.key !== 'select'">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">
                                {{ column.label }}
                            </th>
                            <td mat-cell *matCellDef="let element">
                                <ng-container [ngSwitch]="column.type">
                                    <span *ngSwitchDefault>{{ element[column.key] }}</span>
                                    <span *ngSwitchCase="'bool'">
                                        {{ element[column.key] ? "Yes" : "No" }}
                                    </span>
                                    <span *ngSwitchCase="'date'">{{
                                        element[column.key] | date
                                        }}</span>
                                </ng-container>
                            </td>
                        </ng-container>
                    </ng-container>

                    <!-- Filter Row -->
                    <ng-container *ngFor="let column of columns" [matColumnDef]="column.key + '_filter'">
                        <th mat-header-cell *matHeaderCellDef>
                            <ng-container [ngSwitch]="column.type">
                                <div *ngSwitchCase="'none'"></div>
                                <!-- Text -->
                                <mat-form-field *ngSwitchCase="'text'" appearance="outline">
                                    <input matInput [formControlName]="column.key"
                                        placeholder="Filter {{ column.label }}" />
                                </mat-form-field>

                                <!-- Boolean -->
                                <mat-form-field *ngSwitchCase="'bool'" appearance="outline">
                                    <mat-select [formControlName]="column.key">
                                        <mat-option [value]="true">True</mat-option>
                                        <mat-option [value]="false">False</mat-option>
                                    </mat-select>
                                </mat-form-field>

                                <!-- Number -->
                                <div *ngSwitchCase="'number'" class="range-filter">
                                    <mat-form-field appearance="outline">
                                        <input matInput type="number" [formControl]="
                        $any(filterForm.get(column.key + '_range')?.get('min'))
                      " placeholder="Min" />
                                    </mat-form-field>
                                    <mat-form-field appearance="outline">
                                        <input matInput type="number" [formControl]="
                        $any(filterForm.get(column.key + '_range')?.get('max'))
                      " placeholder="Max" />
                                    </mat-form-field>
                                </div>

                                <!-- Date -->
                                <div *ngSwitchCase="'date'" class="range-filter">
                                    <mat-form-field appearance="outline" [floatLabel]="'always'">
                                        <mat-date-range-input [formGroup]="$any(filterForm.get(column.key + '_range'))"
                                            [rangePicker]="picker">
                                            <input matStartDate formControlName="start" placeholder="From" />
                                            <input matEndDate formControlName="end" placeholder="To" />
                                        </mat-date-range-input>
                                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                                        <mat-date-range-picker #picker></mat-date-range-picker>
                                    </mat-form-field>
                                </div>
                            </ng-container>
                        </th>
                    </ng-container>

                    <!-- Header and Data Rows -->
                    <tr mat-header-row *matHeaderRowDef="visibleColumns"></tr>
                    <tr mat-header-row *matHeaderRowDef="visibleFilterColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: visibleColumns"></tr>
                </table>
            </form>
        </div>
        <mat-paginator [pageSizeOptions]="[5, 10, 25]" [length]="pagination.pageCount"
            showFirstLastButtons></mat-paginator>
    </mat-card-content>
</mat-card>

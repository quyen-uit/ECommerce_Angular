<mat-card>
  <mat-card-title class="card-header">{{ isEditMode ? 'Edit Product Brand' : 'Create Product Brand' }}</mat-card-title>
  <mat-card-content>
    <form [formGroup]="productBrandForm" (ngSubmit)="onSubmit()" class="row">
      <mat-form-field appearance="fill" class="col-lg-4">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="hasError('name','required')">
          Name is required
        </mat-error>
        <mat-error *ngIf="hasError('name','maxlength')">Max length exceeded</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="col-lg-4">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>
      <div class="button-group">
        <button mat-raised-button color="primary" type="submit" [disabled]="!productBrandForm.valid">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

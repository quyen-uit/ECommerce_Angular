<mat-card>
  <mat-card-title class="card-header">{{ isEditMode ? 'Edit Category' : 'Create Category' }}</mat-card-title>
  <mat-card-content>
    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="row">
      <mat-form-field appearance="fill" class="col-lg-4">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="categoryForm.get('name')?.hasError('required')">
          Name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="col-lg-4">
        <mat-label>Order</mat-label>
        <input matInput formControlName="order" type="number" />
        <mat-error *ngIf="categoryForm.get('order')?.hasError('required')">
          Order is required
        </mat-error>
        <mat-error *ngIf="categoryForm.get('order')?.hasError('min')">
          Order must be greater than 0
        </mat-error>
      </mat-form-field>

      <mat-checkbox formControlName="isActive" class="col-lg-4 mt-3">
        Is Active
      </mat-checkbox>

      <div class="button-group">
        <button mat-raised-button color="primary" type="submit" [disabled]="!categoryForm.valid">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

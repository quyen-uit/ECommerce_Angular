<mat-card>
  <mat-card-title class="card-header">{{ isEditMode ? 'Edit Color' : 'Create Color' }}</mat-card-title>
  <mat-card-content>
    <form [formGroup]="colorForm" (ngSubmit)="onSubmit()" class="row">
      <mat-form-field appearance="fill" class="col-lg-4">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="colorForm.get('name')?.hasError('required')">
          Name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="col-lg-4">
        <mat-label>Hexcode</mat-label>
        <input matInput formControlName="hexCode" />
        <mat-error *ngIf="colorForm.get('hexCode')?.hasError('required')">
          HexCode is required
        </mat-error>
      </mat-form-field>
      <div class="button-group">
        <button mat-raised-button color="primary" type="submit" [disabled]="!colorForm.valid">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

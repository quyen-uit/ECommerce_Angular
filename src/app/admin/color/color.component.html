<mat-card>
    <div class="card-header">
        <div class="d-flex gap-3 align-items-center">
            <mat-card-title>Colors</mat-card-title>
            <button mat-raised-button color="primary" (click)="createColor()">Create</button>
        </div>
        <div class="d-flex gap-3 align-items-center">
            <mat-form-field appearance="outline">
                <mat-label>Search</mat-label>
                <input matInput [formControl]="searchControl" placeholder="Ex. Name">
            </mat-form-field>
        </div>
    </div>
    <mat-card-content>

        <table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z8">
            <!-- ID Column -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let color"> {{color.id}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell mat-sort-header *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let color"> {{color.name}} </td>
            </ng-container>

            <!-- HexCode Column -->
            <ng-container matColumnDef="hexCode">
                <th mat-header-cell *matHeaderCellDef> Order </th>
                <td mat-cell *matCellDef="let color"> {{color.hexCode}} </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="action"> Actions </th>
                <td mat-cell *matCellDef="let color">
                    <button mat-button color="accent" (click)="editColor(color.id)">Edit</button>
                    <button mat-button color="warn" (click)="deleteColor(color.id)">Delete</button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
            <tr mat-row *matRowDef="let row; columns: columnsToDisplay;"></tr>
        </table>
    </mat-card-content>
</mat-card>
